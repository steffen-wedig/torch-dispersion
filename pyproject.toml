[project]
name = "torch-dispersion"
version = "0.1.0"
description = "GPU-capable, torch.compile-able dispersion corrections: DFT-D4 and the D3 Axilrod-Teller-Muto term"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29",
    "numpy>=1.26",
    "nvalchemi-toolkit-ops[torch]==0.5.0",
    "pydantic>=2.7",
    "torch>=2.6",
]

[project.optional-dependencies]
# the batched TorchSim model (torch_dispersion.torchsim); the core install does not need it
torchsim = ["torch-sim-atomistic>=0.6.2"]

[dependency-groups]
dev = [
    "dftd3==1.6.0",
    "tad-dftd3",
    "tad-mctc",
    "pytest>=8",
    "ruff",
    "ty",
    "pre-commit",
    "dftd4==4.3.0",
    "tad-dftd4>=0.8.0",
    "tad-multicharge>=0.5.0",
    "vulture>=2.16",
]

[tool.uv]
# the dev group's tad-dftd4 pins numpy<2, which torch-sim forbids on Python 3.13+: lock 3.12 only
environments = ["python_full_version < '3.13'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_dispersion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-cutoff liquid boxes and other long tests (deselect with -m 'not slow')",
    "gpu: requires CUDA (deselect with -m 'not gpu')",
]
addopts = "-ra"

[tool.ty.src]
include = ["src", "scripts", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.vulture]
# tests, scripts and examples count as users of the package code
paths = ["src", "tests", "scripts", "examples"]
min_confidence = 60
ignore_decorators = ["@model_validator"]
ignore_names = [
    # framework hooks and attributes: pydantic, ASE, torch.autograd.Function / nn.Module,
    # TorchSim ModelInterface, pytest
    "model_config",
    "implemented_properties",
    "forward",
    "_memory_scales_with",
    "pytestmark",
    "pytest_collection_modifyitems",
    # public result fields that nothing in the repository reads
    "rms_rel_error",
    "short_range_energy",
    "cp_max_rel_error",
]
