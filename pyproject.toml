[project]
name = "torch-dispersion"
version = "0.1.0"
description = "GPU-capable, torch.compile-able dispersion corrections: DFT-D4 and the D3 Axilrod-Teller-Muto term"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29",
    "numpy>=1.26",
    "nvalchemi-toolkit-ops[torch]==0.4.1",
    "pydantic>=2.7",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "dftd3==1.6.0",
    "tad-dftd3",
    "tad-mctc",
    "pytest>=8",
    "ruff",
    "ty",
    "pre-commit",
    "dftd4==4.3.0",
    "tad-dftd4>=0.8.0",
    "tad-multicharge>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_dispersion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-cutoff liquid boxes and other long tests (deselect with -m 'not slow')",
    "gpu: requires CUDA (deselect with -m 'not gpu')",
]
addopts = "-ra"

[tool.ty.src]
include = ["src", "scripts", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
